<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班级抽奖点名机</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="theme-color" content="#4a6cf7">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/navbar.css">
    <link rel="stylesheet" href="styles/wheel.css">
    <link rel="stylesheet" href="styles/winnerEffects.css">
    <link rel="stylesheet" href="styles/roster.css">
    <link rel="stylesheet" href="styles/settings.css">
    <link rel="stylesheet" href="styles/onedrive.css">
    <link rel="stylesheet" href="styles/update.css">
    <link rel="stylesheet" href="styles/classSwitcher.css">
    <link rel="stylesheet" href="styles/drawHistory.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/mediaLoader.css">
</head>

<body>
    <!-- 启动蒙版：写成静态 HTML（不是等 JS 跑起来再插入），保证它在其它内容之前就先显示出来，
         不会有"先看到一瞬间的空白/主界面再被蒙版盖住"的闪烁。逻辑见 scripts/components/mediaLoader.js -->
    <div class="media-loader-overlay" id="media-loader-overlay">
        <div class="media-loader-box">
            <div class="media-loader-spinner"></div>
            <div class="media-loader-text" id="media-loader-text">正在加载媒体文件…</div>
            <div class="media-loader-progress-track">
                <div class="media-loader-progress-fill" id="media-loader-progress-fill"></div>
            </div>
            <div class="media-loader-percent" id="media-loader-percent">0%</div>
            <span class="media-loader-skip" id="media-loader-skip">加载较慢？点击跳过等待</span>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-brand-container">
            <div class="nav-brand" id="nav-brand-home-btn" title="访问 Shixun 的主页">
                <img src="./icon.png" alt="">
                <span>班级抽奖点名机</span>
            </div>
            <span class="nav-homepagedirector" id="site-credit" title="访问 Shixun 的主页">by Shixun</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" data-page="wheel">抽奖</button>
            <button class="nav-btn" data-page="roster">录入</button>
            <button class="nav-btn" data-page="settings">设置</button>
        </div>
    </nav>

    <!-- 抽奖页 -->
    <div class="page active" id="wheel-page">
        <div class="container">
            <div class="wheel-page-layout" id="wheel-page-body"></div>
        </div>
    </div>

    <!-- 录入页 -->
    <div class="page" id="roster-page">
        <div class="container">
            <div id="roster-page-body"></div>
        </div>
    </div>

    <!-- 设置页 -->
    <div class="page" id="settings-page">
        <div class="container">
            <div id="settings-page-body"></div>
        </div>
    </div>

    <!-- MSAL.js：OneDrive OAuth 静默刷新依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js" crossorigin="anonymous"></script>

    <script src="scripts/components/toast.js"></script>
    <script src="scripts/components/modal.js"></script>
    <script src="scripts/components/imageCropper.js"></script>
    <script src="scripts/components/winnerEffects.js"></script>
    <script src="scripts/components/soundEffects.js"></script>
    <script src="scripts/components/mediaLoader.js"></script>

    <script src="scripts/shortcutUtil.js"></script>
    <script src="scripts/state.js"></script>
    <script src="scripts/components/drawHistory.js"></script>
    <script src="scripts/components/classSwitcher.js"></script>
    <script src="scripts/navigation.js"></script>
    <script src="scripts/updateChecker.js"></script>
    <script src="scripts/persistence.js"></script>
    <script src="scripts/importExport.js"></script>
    <script src="scripts/pwaInstall.js"></script>

    <script src="scripts/onedrive/msalAuth.js"></script>
    <script src="scripts/onedrive/onedriveApi.js"></script>

    <script src="scripts/pages/wheel.js"></script>
    <script src="scripts/pages/roster.js"></script>
    <script src="scripts/pages/settings.js"></script>

    <script src="scripts/app.js"></script>
</body>

</html>
